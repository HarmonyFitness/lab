# Workflow jetable, à supprimer après usage.
#
# Le premier déploiement du lab fitness a mis fitness/CLAUDE.md en ligne.
# L'ajouter à la liste exclude n'a pas suffi : FTP-Deploy-Action ignore les
# fichiers exclus des deux côtés, et le déploiement suivant a réécrit l'état
# du serveur sans ce fichier. Il est donc orphelin : présent sur le serveur,
# absent de l'état de synchronisation, donc invisible pour le sync.
#
# Ce workflow le supprime directement en FTPS. Déclenchement manuel
# uniquement, pour qu'il ne parte jamais tout seul.
name: Supprimer un fichier orphelin (jetable)

on:
  workflow_dispatch:
    inputs:
      chemin:
        description: Chemin du fichier à supprimer, relatif à la racine du site
        required: true
        default: fitness/CLAUDE.md

jobs:
  supprimer:
    runs-on: ubuntu-latest
    steps:
      - name: Avant
        run: |
          curl -sS --ssl-reqd --list-only \
            -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_HOST }}/sites/lab.harmony.ch/fitness/" \
            | sed 's/^/  /'

      - name: Supprimer
        run: |
          curl -sS --ssl-reqd \
            -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_HOST }}/sites/lab.harmony.ch/" \
            -Q "DELE /sites/lab.harmony.ch/${{ inputs.chemin }}" \
            --list-only -o /dev/null
          echo "Suppression demandée : ${{ inputs.chemin }}"

      - name: Après
        run: |
          curl -sS --ssl-reqd --list-only \
            -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_HOST }}/sites/lab.harmony.ch/fitness/" \
            | sed 's/^/  /'
