<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fitness, cours collectifs et bien-être à Genève et Vaud | Harmony</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="assets/wireframe.css?v=2026-10-23z">
</head>
<body>

<div x-data="pageAccueil" x-init="init()">

  <!-- Outillage du wireframe, hors maquette -->
  <div x-html="HF.selecteurEtat(etat, { gabarit: null, base: '' })"></div>

  <div x-html="HF.vues.barreGroupe()"></div>
  <div x-html="HF.vues.entete('', '', etat)"></div>

  <!-- ====================================================== BLOC 1 -->
  <!-- Hero : la photo, la signature et les deux actions que B.3 met en
       tête, s'abonner et trouver un club. La troisième, essayer, est dans
       le header et dans le bandeau de fin de page, comme partout.
       Hors du conteneur : la photo prend toute la largeur de l'écran, avec
       une petite marge, et header + hero tiennent dans la hauteur de
       l'écran (Hugo, 2026-10-22). -->
  <div class="hero-plein">
    <section class="hero-accueil" data-spec="B.3 &gt; Accueil &gt; Hero + CTA primaire">
      <!-- Première vraie photo du lab (fournie par Hugo, 2026-10-22) : un cours
           collectif, des gens qui sourient. Deux tailles, le navigateur prend
           celle qu'il lui faut. -->
      <div class="hero-accueil__photo">
        <img src="assets/photos/hero-cours-collectifs-2400.jpg?v=2026-10-23z"
             srcset="assets/photos/hero-cours-collectifs-1200.jpg?v=2026-10-23z 1200w, assets/photos/hero-cours-collectifs-2400.jpg?v=2026-10-23z 2400w"
             sizes="100vw" alt="Cours collectif en club : une participante sourit, les bras levés, entourée d'autres membres sur leurs steps"
             fetchpriority="high">
      </div>
      <div class="hero-accueil__panneau">
        <h1 class="h-display">Votre bien-être en mouvement</h1>
        <!-- Sous-titre choisi par Hugo (2026-10-23) : trois verbes, le
             parcours d'une visite (s'entraîner, progresser, se détendre),
             l'aquatique, l'accompagnement et le wellness. Le nombre de clubs
             et les cours collectifs sont dans les preuves juste en dessous. -->
        <p>Entraînez-vous en salle ou dans l'eau, progressez avec nos coachs,
           puis détendez-vous dans nos espaces wellness.
</p>
        <p class="hero-accueil__actions">
          <a class="btn" href="tarifs/">S'abonner</a>
          <a class="btn btn--secondaire" href="#clubs">Trouver mon club</a>
        </p>
        <!-- Trois preuves sous les boutons, comme sur la landing (Hugo,
             2026-10-23) : avant de cliquer, on se demande si c'est sérieux
             et si c'est près de chez soi. Deux chiffres déduits, la note
             est un fait à fournir. -->
        <ul class="preuves preuves--photo">
          <li><span class="preuves__valeur" x-text="HF.regles.nbClubs()"></span>
              <span class="preuves__libelle">clubs à Genève et Vaud</span></li>
          <li><span class="preuves__valeur" x-text="HF.regles.nbCoursCollectifs()"></span>
              <span class="preuves__libelle">cours collectifs différents</span></li>
          <li><span class="preuves__valeur">[note] / 5</span>
              <span class="preuves__libelle">[nombre] avis</span></li>
        </ul>
      </div>
    </section>
  </div>

  <main class="conteneur accueil">


    <!-- ====================================================== BLOC 2 -->
    <!-- B.3 veut que l'accueil « porte les arguments pourquoi Harmony » sans
         nommer de bloc. Celui de la landing existe déjà (Q52) : un seul
         bloc, deux pages. -->
    <div x-html="HF.vues.pourquoiHarmony(null, { visages: true })"></div>

    <!-- ====================================================== BLOC 3 -->
    <!-- Aperçu carte clubs. Le module Catégories y est réduit à une ligne
         sous la liste (Hugo, 2026-10-23, Q70) : en bloc, il redisait le
         teaser des formules. -->
    <div x-html="HF.vues.apercuClubs(etat, '')"></div>

    <!-- ====================================================== BLOC 4 -->
    <!-- Offre du moment avec compteur. Absent sans campagne. -->
    <div x-html="HF.vues.teaserOffre(etat, '')"></div>

    <!-- ====================================================== BLOC 5 -->
    <!-- Teaser tarifs : les formules et leur prix « dès », pas de cartes
         produit, rien ne se souscrit sans club référent. -->
    <div x-html="HF.vues.teaserTarifs(etat, '')"></div>

    <!-- ====================================================== BLOC 6 -->
    <!-- Comment s'entraîner : seul (plateau), accompagné (coaching), en
         groupe (cours collectifs et Small Group Training), Hugo,
         2026-10-23. Le bloc suivant prolonge « En groupe » par objectif. -->
    <div x-html="HF.vues.sportEnAvant('')"></div>
    <!-- Les cours par objectif (Hugo, 2026-10-23) : six entrées vers le
         catalogue du hub, à la place de quatre cours mis en avant. -->
    <div x-html="HF.vues.objectifsCours('')"></div>

    <!-- ====================================================== BLOC 7 -->
    <div x-html="HF.vues.teaserBienEtre('')"></div>

    <!-- ====================================================== BLOC 8 -->
    <!-- Preuve sociale : note et avis en placeholder, ce sont des faits.
         Les témoignages sont le composant partagé. -->
    <section data-spec="B.3 &gt; Accueil &gt; preuve sociale (témoignages)">
      <h2>Ce qu'en disent nos membres</h2>
      <div style="margin-top:12px" x-html="HF.vues.noteAvis()"></div>
      <div style="margin-top:24px" x-html="HF.vues.temoignages(3, { portrait: true })"></div>
    </section>

    <!-- ====================================================== BLOC 9 -->
    <div x-html="HF.vues.teaserActualites(3, '')"></div>

    <!-- ====================================================== BLOC 10 -->
    <div x-html="HF.vues.ctaEssai('', 'B.3 &gt; Accueil')"></div>

  </main>

  <!-- Le footer porte la newsletter (bloc 11 de B.3), sur toutes les pages. -->
  <div x-html="HF.vues.pied('')"></div>

</div>

<script src="data/data.js?v=2026-10-23z"></script>
<script src="assets/components.js?v=2026-10-23z"></script>
<script>
document.addEventListener('alpine:init', function () {
  Alpine.data('pageAccueil', function () {
    return {
      etat: HF.etatInitial(),
      init: function () {
        HF.brancher(this.$el, this.etat);
        HF.brancherSelecteur(this.$el, this.etat);
      }
    };
  });
});
</script>
<script defer src="assets/alpine.min.js?v=2026-10-23z"></script>

</body>
</html>
