<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Article | Harmony</title>
<link rel="icon" href="../../favicon.png">
<link rel="stylesheet" href="../../assets/wireframe.css?v=2026-10-29g">
</head>
<body>

<div x-data="pageArticle" x-init="init()" x-effect="document.title = titreOnglet()">


  <div x-html="HF.vues.barreGroupe()"></div>
  <div x-html="HF.vues.entete('', '../../', etat)"></div>

  <main class="conteneur">
    <!-- Une seule racine dans main : posés à nu, les deux x-if comptaient
         comme une section avant l'article et le décalaient de 112 px
         (Hugo, 2026-10-29). -->
    <div>
    <template x-if="!article">
      <section>
        <div x-html="HF.vues.filAriane([{nom:'Accueil',href:'../../'},{nom:'Actualités',href:'../'},{nom:'[article introuvable]'}])"></div>
        <h1>[Article introuvable]</h1>
        <p>Cette adresse ne correspond à aucun article publié.
           <a class="lien-texte" href="../">Voir toutes les actualités</a></p>
      </section>
    </template>

    <template x-if="article">
      <div class="pile-sections">
        <div x-html="HF.vues.filAriane([{nom:'Accueil',href:'../../'},{nom:'Actualités',href:'../'},{nom:article.titre}])"></div>

        <!-- ================================================== BLOC 1 -->
        <!-- En-tête : thème, date, titre, chapeau, photo. Le corps est borné
             en largeur, comme tout texte long. -->
        <section data-spec="B.3 &gt; Actualités &gt; Article (gabarit partagé, B.2)">
          <div x-html="HF.vues.enteteArticle(article)"></div>
        </section>

        <!-- ================================================== BLOC 2 -->
        <section class="article__suite" data-spec="Section 7 &gt; Template 5 &gt; Corps éditorial">
          <div x-html="HF.vues.corpsArticle(article, '../../')"></div>
        </section>

        <!-- Les clubs dont parle l'article (Hugo, 2026-10-29). -->
        <div x-html="HF.vues.clubsDeLArticle(article, etat, '../../')"></div>

        <!-- ================================================== BLOC 3 -->
        <section data-spec="B.3 &gt; Actualités">
          <div x-html="HF.vues.autresArticles(article.id, 3, '../../')"></div>
        </section>

        <!-- ================================================== BLOC 4 -->
        <div x-html="HF.vues.ctaEssai('../../', 'B.3 &gt; Actualités')"></div>
      </div>
    </template>
    </div>

  </main>

  <div x-html="HF.vues.pied('../../')"></div>

</div>

<script src="../../data/data.js?v=2026-10-29g"></script>
<script src="../../assets/components.js?v=2026-10-29g"></script>
<script>
document.addEventListener('alpine:init', function () {
  Alpine.data('pageArticle', function () {
    var id = new URLSearchParams(location.search).get('article') ||
      (HF.regles.articlesFitness()[0] || {}).id;
    return {
      etat: HF.etatInitial(),
      id: id,
      article: HF.regles.article(id),
      init: function () {
        HF.brancher(this.$el, this.etat);
        HF.brancherSelecteur(this.$el, this.etat);
      },
      /* Le title suit l'article. Rédigé, B.3 ne le donne pas (Q58). */
      titreOnglet: function () {
        return (this.article ? this.article.titre : 'Article introuvable') + ' | Harmony';
      }
    };
  });
});
</script>
<script defer src="../../assets/alpine.min.js?v=2026-10-29g"></script>

</body>
</html>
