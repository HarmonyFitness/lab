<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Massage et physiothérapie à Genève et Vaud | Harmony</title>
<link rel="icon" href="../../favicon.png">
<link rel="stylesheet" href="../../assets/wireframe.css?v=2026-10-28s">
</head>
<body>

<div x-data="pageSoins" x-init="init()">

  <!-- Gabarit monté avant les données (Hugo, 2026-10-28). Les soins, les
       praticiens, les durées, les tarifs et l'outil de réservation manquent
       encore (Q56) : ils sont en emplacements entre crochets, rien n'est
       inventé. -->

  <div x-html="HF.vues.barreGroupe()"></div>
  <div x-html="HF.vues.entete('Bien-être', '../../', etat)"></div>

  <main class="conteneur">

    <div x-html="HF.vues.filAriane([
      {nom:'Accueil',href:'../../'},{nom:'Bien-être',href:'../'},{nom:'Massage et physiothérapie'}])"></div>

    <!-- ====================================================== BLOC 1 -->
    <section data-spec="B.3 &gt; Bien-être &gt; Massage &amp; physiothérapie">
      <div class="hero-club">
        <div>
          <h1>Massage et physiothérapie</h1>
          <p>Des praticiens, sur rendez-vous, pour récupérer après l'effort ou
             soulager une douleur. La réservation se fait chez eux, pas ici.</p>
        </div>
        <div x-html="HF.vues.blocImage('Photo cabine de soin', 'large')"></div>
      </div>
    </section>

    <!-- ====================================================== BLOC 2 -->
    <!-- Les soins, rangés en deux familles, avec durée et tarif indicatif.
         « Indicatif » reste à définir (fourchette, ou prix par praticien) :
         Q56, point 3. -->
    <section data-spec="B.3 &gt; Bien-être &gt; Massage &amp; physiothérapie">
      <h2>Nos soins</h2>
      <div class="grille grille--2" style="margin-top:12px">
        <template x-for="f in familles" :key="f.nom">
          <div class="bloc">
            <h3 x-text="f.nom"></h3>
            <ul class="soins">
              <template x-for="s in f.soins" :key="s.nom">
                <li class="soins__ligne">
                  <div>
                    <strong x-text="s.nom"></strong>
                    <p class="mention" x-text="s.texte"></p>
                  </div>
                  <div class="soins__infos">
                    <span x-text="s.duree"></span>
                    <span x-text="s.tarif"></span>
                  </div>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </div>
    </section>

    <!-- ====================================================== BLOC 3 -->
    <!-- Un praticien par carte, avec son club et le bouton qui sort vers son
         outil de réservation. Le lien reçoit le club et le soin si l'outil
         l'accepte (B.3 : « paramétré si possible », Q56, point 4). Le club
         viendra d'un champ de la fiche club, comme les équipements : la page
         dira alors où, comme la page Espaces. -->
    <section data-spec="B.3 &gt; Bien-être &gt; Massage &amp; physiothérapie">
      <h2>Nos praticiens</h2>
      <div class="grille grille--cartes defile-mobile defile-mobile--egal" style="margin-top:12px">
        <template x-for="p in praticiens" :key="p.id">
          <div class="produit">
            <div x-html="HF.vues.blocImage('Photo praticien', 'large')"></div>
            <h3 style="margin-top:12px" x-text="p.nom"></h3>
            <p class="mention" x-text="p.specialite + ' · ' + p.club"></p>
            <p x-text="p.bio"></p>
            <p class="carte__action">
              <a class="btn btn--secondaire" href="#">Prendre rendez-vous</a>
            </p>
            <p class="mention">Sur le site de réservation du praticien.</p>
          </div>
        </template>
      </div>
    </section>

    <!-- ====================================================== BLOC 4 -->
    <section data-spec="B.3 &gt; Bien-être &gt; Massage &amp; physiothérapie">
      <h2>Bon à savoir</h2>
      <div class="grille grille--3" style="margin-top:12px">
        <template x-for="r in pratique" :key="r.titre">
          <div class="bloc">
            <h3 x-text="r.titre"></h3>
            <p x-text="r.texte"></p>
          </div>
        </template>
      </div>
      <p style="margin-top:14px">
        <a class="btn btn--tertiaire" href="../espaces/">Voir aussi les espaces wellness</a>
      </p>
    </section>

    <div style="margin-top:44px"
         x-html="HF.vues.ctaEssai('../../', 'B.3 &gt; Bien-être &gt; Massage &amp; physiothérapie')"></div>

  </main>

  <div x-html="HF.vues.pied('../../')"></div>

</div>

<script src="../../data/data.js?v=2026-10-28s"></script>
<script src="../../assets/components.js?v=2026-10-28s"></script>
<script>
document.addEventListener('alpine:init', function () {
  /* Emplacements : la liste des soins, leurs durées, les tarifs et les
     praticiens ne sont pas fournis (Q56). Un prix ne s'invente pas. */
  function soin(n) {
    return { nom: '[Soin ' + n + ']', duree: '[Durée]', tarif: '[Tarif]',
      texte: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit.' };
  }
  function praticien(n, specialite) {
    return { id: n, nom: '[Prénom Nom]', specialite: specialite, club: '[Club]',
      bio: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.' };
  }
  Alpine.data('pageSoins', function () {
    return {
      etat: HF.etatInitial(),
      familles: [
        { nom: 'Massage', soins: [soin(1), soin(2), soin(3)] },
        { nom: 'Physiothérapie', soins: [soin(4), soin(5), soin(6)] }
      ],
      praticiens: [praticien(1, '[Massage]'), praticien(2, '[Physiothérapie]'), praticien(3, '[Massage]')],
      pratique: [
        { titre: '[Réservation]', texte: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor.' },
        { titre: '[Remboursement]', texte: 'Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut.' },
        { titre: '[Annulation]', texte: 'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore.' }
      ],
      init: function () {
        HF.brancher(this.$el, this.etat);
        HF.brancherSelecteur(this.$el, this.etat);
      }
    };
  });
});
</script>
<script defer src="../../assets/alpine.min.js?v=2026-10-28s"></script>

</body>
</html>
