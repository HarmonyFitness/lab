<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Musculation, cours collectifs et coaching | Harmony</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../assets/wireframe.css?v=2026-10-28zx">
</head>
<body>
<div x-data="page" x-init="init()">
  <div x-html="HF.vues.barreGroupe()"></div>
  <div x-html="HF.vues.entete('Sport', '../', etat)"></div>

  <main class="conteneur">
    <section data-spec="B.3 &gt; Titres de la branche Sport" style="padding-top:28px">
      <h1>Le sport chez Harmony</h1>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod
         tempor incididunt ut labore et dolore magna aliqua.</p>
    </section>

    <section data-spec="B.3 &gt; Sport &gt; Sport (hub)">
      <div class="grille grille--2">
        <template x-for="p in piliers" :key="p.href">
          <!-- Carte couchée : la photo à gauche, le texte à droite. Quatre
               cartes empilées image-titre-texte-bouton faisaient quatre
               écrans et demi sur mobile et deux sur ordinateur, pour une
               page dont le seul rôle est de router. -->
          <div class="bloc bloc--couche">
            <div x-html="HF.vues.blocImage(p.photo, 'carre')"></div>
            <div class="bloc--couche__texte">
              <h2 x-text="p.titre"></h2>
              <p x-text="p.texte"></p>
              <p class="mention"><strong x-html="p.inclus"></strong></p>
              <div class="produit__pied">
                <a class="btn btn--secondaire" :href="p.href" x-text="p.lien"></a>
              </div>
            </div>
          </div>
        </template>
      </div>
    </section>

    <section data-spec="B.3 &gt; Sport &gt; Sport (hub) &gt; teaser planning">
      <h2>Le planning des cours</h2>
      <p>Retrouvez le planning type de tous les clubs, filtrable par club, type
         et intensité.</p>
      <p><a class="btn" href="cours-collectifs/#planning">Voir le planning</a></p>
    </section>

    <div x-html="HF.vues.ctaEssai('../', 'B.3 > Sport > Sport (hub)')"></div>
  </main>

  <div x-html="HF.vues.pied('../')"></div>
</div>
<script src="../data/data.js?v=2026-10-28zx"></script>
<script src="../assets/components.js?v=2026-10-28zx"></script>
<script>
document.addEventListener('alpine:init', function () {
  Alpine.data('page', function () {
    return {
      etat: HF.etatInitial(),
      /* Une seule source pour le hub et l'accueil (HF.vues.piliersSport). */
      piliers: HF.vues.piliersSport(''),
      init: function () { HF.brancher(this.$el, this.etat); HF.brancherSelecteur(this.$el, this.etat); }
    };
  });
});
</script>
<script defer src="../assets/alpine.min.js?v=2026-10-28zx"></script>
</body>
</html>
