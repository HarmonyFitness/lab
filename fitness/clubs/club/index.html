<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Salle de sport | Harmony</title>
<link rel="icon" href="../../favicon.png">
<link rel="stylesheet" href="../../assets/wireframe.css?v=2026-10-29c">
</head>
<body>

<div x-data="pageClub" x-init="init()">


  <div x-html="HF.vues.barreGroupe()"></div>
  <div x-html="HF.vues.entete('Clubs', '../../', etat)"></div>

  <template x-if="!club">
    <main class="conteneur" style="padding-top:28px">
      <h1>Club inconnu</h1>
      <p>Choisissez un club dans le sélecteur d'état, ou revenez au
         <a href="../">hub des clubs</a>.</p>
    </main>
  </template>

  <template x-if="club">
    <div>
      <main class="conteneur">

        <div x-html="HF.vues.filAriane([
          { nom: 'Accueil', href: '../../' },
          { nom: 'Clubs', href: '../' },
          { nom: club.nom }
        ])"></div>

        <!-- ================================================== BLOC 1 -->
        <section data-spec="B.3 &gt; Trame de la page club &gt; 1">
          <div class="hero-club">
            <div>
              <h1 x-text="'Harmony ' + club.nom"></h1>
              <p x-text="sousTitre()"></p>
              <p x-html="HF.vues.badgeCategorie(club.categorie, { sansLigne: true, cle: 'hero', ouvert: etat.catOuverte === club.categorie + '@hero' })"></p>
              <p class="mention" x-show="club.categorie === 'gym'">
                Horaires élargis : [plage horaire Gym].
              </p>
              <!-- Le prix sous le bouton qu'il concerne (Hugo, 2026-10-28). -->
              <div class="hero-club__actions">
                <div class="hero-club__abonner">
                  <a class="btn" :href="'../../tarifs/?club=' + club.id + '&source=page-club'">S'abonner</a>
                  <span class="mention" x-html="HF.vues.desParMoisTexte(club.id, etat)"></span>
                </div>
                <a class="btn btn--secondaire" href="../../seance-essai/">Demander une séance d'essai</a>
              </div>
            </div>
          </div>
        </section>

        <!-- Onglets (Hugo, 2026-10-28) : le hero ne donnait que S'abonner et
             l'essai ; on va en un geste au planning ou à l'équipe. Posés
             entre le texte du hero et sa photo, pour être vus à l'arrivée :
             sous la photo, ils tombaient sous le bord de l'écran. -->
        <div class="hote-collant" x-html="HF.vues.ongletsPage(onglets(), { libelle: 'Sur la page du club',
          cta: { href: '../../tarifs/?club=' + club.id + '&source=page-club', libelle: 'S\'abonner' } })"></div>
        <div class="hero-club__photo" x-html="HF.vues.blocImage('Photo du club ' + club.nom, 'large')"></div>

        <!-- ================================================== BLOC 3 -->
        <div id="infos" x-html="HF.vues.infosPratiques(club)"></div>

        <!-- ================================================== BLOC 4 -->
        <div id="planning" x-html="HF.vues.planning(club.id, etat)"></div>
        <p class="mention" x-show="club.categorie === 'gym'" data-spec="B.3 &gt; Variante Gym">
          Pas de cours collectifs dans un club Gym : seuls les Small Group
          Training apparaissent au planning, marqués « Extra ».
        </p>

        <!-- ============================ BLOC 5, remplacé en variante Gym -->
        <div id="cours" x-html="HF.vues.coursDuClub(club)"></div>
        <div x-html="HF.vues.passerelleCoursCollectifs(club)"></div>

        <!-- ================================================== BLOC 6 -->
        <div id="formules" x-html="HF.vues.formulesEtExtras(club, etat)"></div>

        <!-- ================================================== BLOC 7 -->
        <section id="equipe" data-spec="B.3 &gt; Trame de la page club &gt; 7">
          <h2 x-text="'L\'équipe de ' + club.nom"></h2>
          <div x-html="HF.vues.grilleCoachs(HF.regles.coachsDuClub(club.id), etat)"></div>
          <!-- Maillage interne (Hugo, 2026-10-28) : de l'équipe au coaching. -->
          <p style="margin-top:14px"><a class="lien-texte" href="../../sport/coaching-personnel/">Découvrir le coaching personnel</a></p>
        </section>

        <!-- ================================================== BLOC 8 -->
        <div id="equipements" x-html="HF.vues.equipementsBloc(club, '../../')"></div>

        <!-- ================================================== BLOC 9 -->
        <div id="bien-etre" x-html="HF.vues.bienEtreBloc(club, '../../')"></div>

        <!-- ================================================= BLOC 10 -->
        <div x-html="HF.vues.passerelleNatation(club)"></div>

        <!-- ================================================= BLOC 11 -->
        <section id="images" data-spec="B.3 &gt; Trame de la page club &gt; 11">
          <h2>En images</h2>
          <div x-html="HF.vues.storiesClub(club, etat)"></div>
          <h2 class="h-bloc">Ils viennent ici</h2>
          <div x-html="HF.vues.temoignages(3)"></div>
        </section>

        <!-- Les articles qui citent le club (maillage interne, Hugo, 2026-10-28). -->
        <div x-html="HF.vues.articlesQuiCitent('club', club.id, '../../', 'Dans l\'actualité de ' + club.nom)"></div>

        <!-- ================================================= BLOC 12 -->
        <div x-html="HF.vues.offreDuClub(club, etat)"></div>

        <!-- ================================================= BLOC 13 -->
        <section id="questions" data-spec="B.3 &gt; Trame de la page club &gt; 13">
          <h2>Questions sur ce club</h2>
          <div x-html="HF.vues.faq(faqLocale(), etat)"></div>
        </section>

        <!-- ================================================= BLOC 14 -->
        <div x-html="HF.vues.clubsProximite(club, etat)"></div>

        <!-- ================================================= BLOC 15 -->
        <div x-html="HF.vues.ctaEssai('../../', 'B.3 > Trame de la page club > 15')"></div>

      </main>

      <div x-html="HF.vues.pied('../../')"></div>
    </div>
  </template>

</div>

<script src="../../data/data.js?v=2026-10-29c"></script>
<script src="../../assets/components.js?v=2026-10-29c"></script>
<script>
document.addEventListener('alpine:init', function () {
  Alpine.data('pageClub', function () {
    return {
      etat: HF.etatInitial(),
      get club() { return this.etat.club ? HF.club(this.etat.club) : null; },
      init: function () {
        /* Ce gabarit se lit toujours pour un club : sans paramètre, on ouvre
           le premier de la liste plutôt qu'une page vide. */
        if (!this.etat.club) { this.etat.club = HF.data.clubs[0].id; HF.majUrl(this.etat); }
        HF.brancher(this.$el, this.etat);
        HF.brancherSelecteur(this.$el, this.etat);
        this.$watch('etat.club', function () { this.majTitre(); }.bind(this));
        this.majTitre();
      },
      /* Les onglets ne nomment que les sections présentes : pas de Cours
         dans un club Gym, pas de Bien-être dans un club qui n'a ni espace
         ni soin. Mêmes conditions que les blocs eux-mêmes. */
      onglets: function () {
        var c = this.club, R = HF.regles;
        return [
          { id: 'infos', nom: 'Infos pratiques' },
          { id: 'planning', nom: 'Planning' },
          R.coursParObjectif(c.id).length ? { id: 'cours', nom: 'Cours' } : null,
          { id: 'formules', nom: 'Formules' },
          { id: 'equipe', nom: 'L\'équipe' },
          { id: 'equipements', nom: 'Équipements' },
          (R.bienEtreDuClub(c.id).length || (c.soins || []).length) ? { id: 'bien-etre', nom: 'Bien-être' } : null,
          { id: 'images', nom: 'En images' },
          { id: 'questions', nom: 'Questions' }
        ].filter(Boolean);
      },
      /* B.3 > SEO des pages clubs : requête générique dans le title. */
      majTitre: function () {
        var c = this.club;
        document.title = c
          ? 'Salle de sport à ' + c.ville + ' [complément] | Harmony ' + c.nom
          : 'Salle de sport | Harmony';
      },
      /* B.3 > SEO des pages clubs : "salle de sport" dans le sous-titre. */
      sousTitre: function () {
        var c = this.club;
        return 'Votre salle de sport à ' + c.ville +
          (c.quartier ? ', quartier ' + c.quartier : '') +
          '. Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor.';
      },
      /* B.3 > Trame de la page club > 13 : parking, vestiaires, enfants, piscine. */
      faqLocale: function () {
        var c = this.club, q = [
          { q: 'Y a-t-il un parking ?', r: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore.' },
          { q: 'Comment sont les vestiaires ?', r: 'Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea.' },
          { q: 'Les enfants sont-ils acceptés ?', r: 'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla.' }
        ];
        if (c.bassin) q.push({ q: 'La piscine est-elle accessible ?', r: 'Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit.' });
        return q;
      }
    };
  });
});
</script>
<script defer src="../../assets/alpine.min.js?v=2026-10-29c"></script>

</body>
</html>
