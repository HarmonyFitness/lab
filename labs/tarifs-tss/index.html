<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tarifs studio de sport à Bordeaux centre</title>
<meta name="description" content="Découvrez les tarifs de notre studio The Sport Society à Bordeaux centre : cours à l'unité, packs, abonnements et formules adaptées à vos besoins." />
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300..800;1,300..800&family=DM+Serif+Text:ital@0;1&display=swap" />

<style>
:root {
  /* Palette relevée sur le modèle */
  --primary:      #801624;   /* bordeaux : logo, nav, boutons */
  --primary-dark: #6b1220;
  --ink:          #1c0f0a;   /* texte principal */
  --ink-2:        #3f3f47;   /* texte secondaire */
  --ink-3:        #6f6f78;
  --muted:        #9f9fa9;   /* prix barré, texte discret */
  --muted-2:      #ababab;   /* bandeau d'annonces */
  --line:         #1c0f0a;   /* filets des accordéons */
  --border:       #cfcac8;   /* contour des cartes */
  --bg:           #ffffff;
  --bg-soft:      #faf8f7;

  --font-sans:  "Libre Franklin", "Franklin Gothic", "Helvetica Neue", Arial, sans-serif;
  --font-serif: "DM Serif Text", "Times New Roman", Times, serif;

  --radius:     16px;
  --radius-sm:  8px;

  --header-h:   72px;
  --marquee-h:  34px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img { max-width: 100%; display: block; }

.shell { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
@media (max-width: 700px) { .shell { padding: 0 18px; } }

/* =========================================================
   EN-TÊTE
   ========================================================= */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  height: var(--header-h);
  background: #fff;
  display: flex; align-items: center;
}
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 28px; width: 100%; }

.logo { display: inline-flex; flex-direction: column; align-items: center; color: var(--primary); line-height: 1; flex: none; }
.logo-top {
  font-weight: 700; font-size: 21px; letter-spacing: -0.015em;
  font-stretch: condensed;
}
.logo-bottom {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--font-serif); font-style: italic;
  font-size: 17px; letter-spacing: 0.01em; margin-top: 1px;
}
.logo-bottom::before, .logo-bottom::after {
  content: ""; width: 13px; height: 1px; background: currentColor; display: block;
}

.nav { display: flex; align-items: center; gap: 26px; }
.nav a {
  color: var(--primary);
  font-size: 12.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
  white-space: nowrap;
  position: relative; padding: 4px 0;
  transition: opacity .15s;
}
.nav a:hover { opacity: .68; }
.nav a.is-serif {
  font-family: var(--font-serif); font-style: italic; font-weight: 400;
  font-size: 16px; letter-spacing: 0; text-transform: none;
}

.header-right { display: flex; align-items: center; gap: 18px; }
.icon-btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; color: var(--primary);
  transition: opacity .15s;
}
.icon-btn:hover { opacity: .68; }
.cart-count {
  position: absolute; top: -3px; right: -4px;
  min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: var(--primary); color: #fff;
  font-size: 9.5px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 2px #fff;
}
.btn-book {
  display: inline-flex; align-items: center; justify-content: center;
  height: 42px; padding: 0 22px;
  border-radius: var(--radius-sm);
  background: var(--primary); color: #fff;
  font-size: 13.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  transition: background .18s;
  white-space: nowrap;
}
.btn-book:hover { background: var(--primary-dark); }

.burger { display: none; width: 32px; height: 32px; color: var(--primary); align-items: center; justify-content: center; }
@media (max-width: 1120px) {
  .nav { display: none; }
  .burger { display: inline-flex; }
}
@media (max-width: 560px) {
  .btn-book { height: 38px; padding: 0 15px; font-size: 12px; }
  .header-right { gap: 11px; }
}

/* Menu déroulant mobile */
.mobile-nav {
  position: fixed; left: 0; right: 0; top: var(--header-h); z-index: 55;
  background: #fff; border-bottom: 1px solid #eee;
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows .28s cubic-bezier(.22,1,.36,1);
}
.mobile-nav.open { grid-template-rows: 1fr; }
.mobile-nav > div { overflow: hidden; }
.mobile-nav nav { display: flex; flex-direction: column; padding: 8px 0 18px; }
.mobile-nav a {
  padding: 13px 32px; color: var(--primary);
  font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
}
.mobile-nav a.is-serif { font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: 18px; text-transform: none; letter-spacing: 0; }

/* =========================================================
   BANDEAU D'ANNONCES
   ========================================================= */
.marquee {
  position: fixed; top: var(--header-h); left: 0; right: 0; z-index: 50;
  height: var(--marquee-h);
  background: #fff; border-top: 1px solid #f0eeed; border-bottom: 1px solid #f0eeed;
  overflow: hidden; display: flex; align-items: center;
}
.marquee-track { display: flex; width: max-content; animation: marquee 48s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee-run { display: flex; align-items: center; flex: none; }
.marquee-item {
  display: inline-flex; align-items: center; gap: 8px;
  margin-right: 150px; white-space: nowrap;
  color: var(--muted-2);
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
}
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .marquee-track { animation: none; } }

/* =========================================================
   HERO
   ========================================================= */
.hero {
  position: relative;
  margin-top: calc(var(--header-h) + var(--marquee-h));
  height: 421px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  background: #ba957a;
}
.hero-img {
  position: absolute; inset: 0;
  background:
    radial-gradient(60% 120% at 12% 55%, #8c7873 0%, rgba(140,120,115,0) 62%),
    radial-gradient(55% 110% at 30% 80%, #624339 0%, rgba(98,67,57,0) 58%),
    linear-gradient(100deg, #7a605c 0%, #8c7873 22%, #6b6f78 46%, #6d94a7 72%, #7299ac 100%);
}
.hero-img::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(40,25,20,.18) 0%, rgba(40,25,20,.06) 45%, rgba(40,25,20,.2) 100%);
}
.hero h1 {
  position: relative; z-index: 2;
  margin: 0; text-align: center; color: #fff;
  font-size: clamp(34px, 4.4vw, 52px);
  font-weight: 400; line-height: 1.05; letter-spacing: -0.01em;
}
.hero h1 em {
  font-family: var(--font-serif); font-style: italic; font-weight: 400;
  font-size: 1.08em;
}
@media (max-width: 760px) {
  .hero { height: 300px; }
  .hero h1 { display: inline-flex; flex-direction: column; }
}

/* =========================================================
   SECTIONS
   ========================================================= */
main { padding-bottom: 40px; }
.section { padding-top: 72px; }
.section-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.section-title {
  display: inline-flex; align-items: center; gap: 12px;
  margin: 0; font-size: clamp(21px, 2.2vw, 27px); font-weight: 700;
  letter-spacing: -0.015em; color: var(--ink);
}
.section-emoji { font-size: .92em; line-height: 1; }
.section-note { font-family: var(--font-serif); font-style: italic; font-size: 17px; color: var(--ink); }
.section-lead { margin: 22px 0 12px; font-size: 14px; color: var(--ink-2); }

/* Étiquette verticale à gauche d'un groupe */
.group { display: flex; align-items: stretch; gap: 16px; }
.group-tag {
  writing-mode: vertical-rl; transform: rotate(180deg);
  display: flex; align-items: center; justify-content: center;
  flex: none; padding: 6px 0;
  font-size: 9.5px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-3); white-space: nowrap;
}
.group-body { flex: 1 1 auto; min-width: 0; }
@media (max-width: 800px) {
  .group { display: block; }
  .group-tag { writing-mode: horizontal-tb; transform: none; justify-content: flex-start; padding: 0 0 10px; }
}

.cards { display: grid; gap: 16px; align-items: stretch; }
.cards.c1 { grid-template-columns: minmax(0, 1fr); }
.cards.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cards.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.season-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); gap: 26px; margin-top: 30px; align-items: start; }
.narrow { max-width: 560px; }

@media (max-width: 1080px) {
  .season-row { grid-template-columns: 1fr; }
  .cards.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) { .cards.c3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) {
  .cards.c2, .cards.c3, .cards.c4 { grid-template-columns: 1fr; }
  .narrow { max-width: none; }
}

/* =========================================================
   CARTE PRODUIT
   ========================================================= */
.card {
  display: flex; flex-direction: column;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 11px 14px;
  transition: border-color .18s, box-shadow .22s;
}
.card:hover { border-color: var(--ink); box-shadow: 0 10px 28px rgba(28,15,10,.08); }

.card-media { position: relative; aspect-ratio: 16 / 11; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.card-media .fill { position: absolute; inset: 0; }
.card-badges { position: absolute; inset: 8px 8px auto 8px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.badge {
  background: #fff; color: var(--ink-2);
  border-radius: var(--radius-sm);
  padding: 6px 11px;
  font-size: 11px; font-weight: 500; letter-spacing: 0;
  white-space: nowrap;
}
.badge-save { color: var(--primary); font-weight: 700; }

.card-title {
  margin: 0 0 5px; text-align: center;
  font-size: 17px; font-weight: 700; letter-spacing: -0.005em; text-transform: uppercase;
  line-height: 1.2; color: var(--ink);
}
.card-sub { margin: 0 0 8px; text-align: center; font-size: 13px; line-height: 1.4; color: var(--ink-2); }
.card-unit { margin: 0 0 20px; text-align: center; font-size: 14px; color: var(--ink-2); }
.card-unit .was { color: var(--muted); text-decoration: line-through; margin-right: 5px; }

/* Accordéons : libellé gras, filet noir dessous */
.acc { border-bottom: 1px solid var(--line); }
.acc-head {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 2px 10px; text-align: left;
  font-size: 13.5px; font-weight: 700; color: var(--ink);
}
.acc-sign { position: relative; width: 13px; height: 13px; flex: none; }
.acc-sign::before, .acc-sign::after {
  content: ""; position: absolute; background: var(--ink); border-radius: 1px;
  transition: transform .24s cubic-bezier(.22,1,.36,1), opacity .18s;
}
.acc-sign::before { top: 6px; left: 0; width: 13px; height: 1.5px; }
.acc-sign::after { left: 6px; top: 0; width: 1.5px; height: 13px; }
.acc.open .acc-sign::after { transform: rotate(90deg); opacity: 0; }
.acc-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s cubic-bezier(.22,1,.36,1); }
.acc.open .acc-panel { grid-template-rows: 1fr; }
.acc-panel > div { overflow: hidden; }
.acc-body { margin: 0; padding: 2px 2px 12px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }

.card-foot { margin-top: auto; padding-top: 22px; }
.card-price { display: flex; align-items: baseline; justify-content: center; gap: 10px; margin-bottom: 16px; }
.card-price .now { font-size: 27px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
.card-price .old { font-size: 15px; color: var(--muted); text-decoration: line-through; }
.btn-cart {
  width: 100%; display: inline-flex; align-items: center; justify-content: center;
  height: 42px; border-radius: var(--radius-sm);
  background: var(--primary); color: #fff;
  font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  transition: background .18s;
}
.btn-cart:hover { background: var(--primary-dark); }
.btn-cart.added { background: var(--ink); }

/* =========================================================
   ONGLETS (engagement, type de carnet)
   ========================================================= */
.tabs { position: relative; display: inline-flex; align-items: center; gap: 2px; padding: 4px; border: 1px solid var(--border); border-radius: 999px; }
.tabs .pill { position: absolute; top: 4px; bottom: 4px; border-radius: 999px; background: var(--primary); transition: transform .32s cubic-bezier(.22,1,.36,1), width .32s cubic-bezier(.22,1,.36,1); pointer-events: none; z-index: 0; }
.tabs button {
  position: relative; z-index: 1;
  padding: 9px 20px; border-radius: 999px;
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  transition: color .2s; white-space: nowrap;
}
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: #fff; }

/* =========================================================
   CARTES CADEAUX
   ========================================================= */
.gifts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 30px; }
@media (max-width: 820px) { .gifts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .gifts { grid-template-columns: 1fr; } }
.gift {
  position: relative; overflow: hidden;
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 11px 11px 16px;
  display: flex; flex-direction: column;
  transition: border-color .18s, box-shadow .22s;
}
.gift:hover { border-color: var(--ink); box-shadow: 0 10px 28px rgba(28,15,10,.08); }
.gift-media { aspect-ratio: 16 / 9; border-radius: 12px; margin-bottom: 16px; }
.gift-amount { margin: 0 0 5px; text-align: center; font-size: 17px; font-weight: 700; text-transform: uppercase; }
.gift-desc { margin: 0 0 20px; text-align: center; font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.gift .card-foot { margin-top: auto; padding-top: 0; }

/* =========================================================
   BANDEAU APPLICATION
   ========================================================= */
.appband { position: relative; margin-top: 84px; overflow: hidden; background: #5d1420; min-height: 470px; display: flex; align-items: center; }
.appband-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(55% 100% at 20% 55%, #7b2230 0%, rgba(123,34,48,0) 62%),
    linear-gradient(105deg, #4a0f1a 0%, #6b1220 42%, #8d3a3a 74%, #c2a48c 100%);
}
.appband-inner { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; padding: 64px 0; width: 100%; }
.appband-art { display: flex; justify-content: center; }
.phone { width: 208px; height: 300px; border-radius: 26px; padding: 11px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.24); box-shadow: 0 34px 64px rgba(0,0,0,.36); }
.phone-screen { height: 100%; border-radius: 17px; background: #fbf9f8; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.phone-bar { border-radius: 5px; background: #ece7e5; }
.phone-bar.accent { background: #e3cdd1; }
.appband-copy { color: #fff; }
.app-eyebrow { display: inline-flex; padding: 7px 14px; border-radius: 6px; background: #fff; color: var(--primary); font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; }
.app-title { margin: 20px 0 16px; font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: clamp(32px, 4.2vw, 46px); line-height: 1.05; color: #e6ddd4; }
.app-sub { margin: 0 0 26px; max-width: 400px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; line-height: 1.75; color: rgba(255,255,255,.82); }
.stores { display: flex; gap: 12px; flex-wrap: wrap; }
.store {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 9px 17px; border-radius: var(--radius-sm);
  background: #111; border: 1px solid rgba(255,255,255,.2); color: #fff;
  transition: transform .15s, border-color .18s;
}
.store:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.42); }
.store-sm { display: block; font-size: 8.5px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,.7); }
.store-lg { display: block; font-size: 14px; font-weight: 600; }
@media (max-width: 900px) {
  .appband-inner { grid-template-columns: 1fr; gap: 34px; padding: 48px 0; }
  .appband-art { order: 2; }
}

/* =========================================================
   PIED DE PAGE
   ========================================================= */
.footer { padding: 52px 0 42px; text-align: center; background: #fff; }
.footer-links { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 2px; font-size: 14px; color: var(--ink); }
.footer-links a { padding: 4px 10px; transition: color .15s; }
.footer-links a:hover { color: var(--primary); }
.footer-links .sep { color: var(--muted); }
.footer-legal { margin-top: 26px; display: flex; flex-direction: column; gap: 9px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--primary); }
.footer-legal a:hover { opacity: .68; }
.footer-social { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 26px 0 22px; color: var(--primary); }
.footer-social a { transition: opacity .15s; }
.footer-social a:hover { opacity: .68; }
.footer-copy { margin: 0; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<script type="text/babel">
const { useState, useRef, useLayoutEffect } = React;

/* =========================================================
   DONNÉES — reprises de thesportsociety.fr/tarifs
   ========================================================= */
const NAV = [
  { label: "Studio" },
  { label: "Cours" },
  { label: "Tarifs", active: true },
  { label: "Planning" },
  { label: "Events" },
  { label: "Contact" },
  { label: "Journal", serif: true },
];

const ANNONCES = [
  "Au studio 15 place Pey Berland",
  "🧘🏼‍♀️ Offre découverte : 1 cours acheté = 1 cours offert",
  "🔥 Nouveau studio 15 place Pey Berland",
];

/* Aplats de substitution : les photos du modèle ne sont pas reprises. */
const FILL = [
  "linear-gradient(150deg, #c9a184 0%, #a9765a 55%, #6b3f2e 100%)",
  "linear-gradient(150deg, #d8bda6 0%, #a97e63 60%, #5f3b2c 100%)",
  "linear-gradient(150deg, #9fc0d0 0%, #7299ac 55%, #4a6b7c 100%)",
  "linear-gradient(150deg, #b08a7a 0%, #7a4a3c 60%, #43231c 100%)",
  "linear-gradient(150deg, #e0cbb8 0%, #b8917a 58%, #7d5744 100%)",
  "linear-gradient(150deg, #8fb3c4 0%, #63899c 55%, #3c5866 100%)",
];

const DETAILS = "Accès à l'ensemble de nos salles. Réservation des créneaux depuis l'application, annulation gratuite jusqu'à 12 h avant le cours.";
const VALIDITE_ABO = "Reconduction automatique à échéance. Résiliable après la période d'engagement, avec un préavis d'un mois.";
const VALIDITE_CARNET = "Cours à utiliser dans les 12 mois suivant l'achat. Crédits nominatifs, non remboursables.";

const PACK_RENTREE = {
  id: "pack-rentree",
  title: "Pack rentrée",
  sub: "5 cours valables dans toutes nos salles en septembre",
  price: 99, old: 130, save: "- 24%", fill: 0,
  details: "5 cours à répartir librement sur l'ensemble des salles et des formats, sans engagement.",
  validite: "Valable du 1ᵉʳ au 30 septembre. Crédits nominatifs, non remboursables.",
};

/* base = tarif de référence, p3 = engagement 3 mois (modèle), p12 = engagement 12 mois (projection −20 %) */
const ABOS = [
  { id: "abo-4",  n: 4,  title: "4 cours / mois",  base: 99,  p3: 89,  p12: 79,  fill: 1 },
  { id: "abo-8",  n: 8,  title: "8 cours / mois",  base: 176, p3: 159, p12: 141, fill: 2 },
  { id: "abo-12", n: 12, title: "12 cours / mois", base: 245, p3: 223, p12: 196, fill: 3 },
];

const ENGAGEMENTS = [
  { id: "3",  label: "3 mois",  key: "p3",  save: "- 10%" },
  { id: "12", label: "12 mois", key: "p12", save: "- 20%" },
];

const eur = (n) => `${n} €`;

/* =========================================================
   BRIQUES
   ========================================================= */
function Tabs({ items, value, onChange }) {
  const ref = useRef(null);
  const [pill, setPill] = useState({ left: 0, width: 0 });
  useLayoutEffect(() => {
    const el = ref.current && ref.current.querySelector("button.on");
    if (el) setPill({ left: el.offsetLeft, width: el.offsetWidth });
  }, [value, items]);
  return (
    <div className="tabs" ref={ref}>
      <span className="pill" style={{ transform: `translateX(${pill.left}px)`, width: pill.width }} />
      {items.map((it) => (
        <button key={it.id} className={it.id === value ? "on" : ""} onClick={() => onChange(it.id)} aria-pressed={it.id === value}>
          {it.label}
        </button>
      ))}
    </div>
  );
}

function Accordion({ label, children }) {
  const [open, setOpen] = useState(false);
  return (
    <div className={"acc" + (open ? " open" : "")}>
      <button className="acc-head" onClick={() => setOpen((o) => !o)} aria-expanded={open}>
        {label}
        <span className="acc-sign" aria-hidden="true" />
      </button>
      <div className="acc-panel"><div><p className="acc-body">{children}</p></div></div>
    </div>
  );
}

function Card({ item, unit, badges, onAdd }) {
  const [added, setAdded] = useState(false);
  const add = () => { setAdded(true); onAdd(); setTimeout(() => setAdded(false), 1500); };
  return (
    <article className="card">
      <div className="card-media">
        <div className="fill" style={{ background: FILL[item.fill % FILL.length] }} />
        {badges && badges.length ? (
          <div className="card-badges">
            {badges.map((b, i) => (
              <span key={i} className={"badge" + (b.save ? " badge-save" : "")}>{b.text}</span>
            ))}
          </div>
        ) : null}
      </div>

      <h3 className="card-title">{item.title}</h3>
      {item.sub ? <p className="card-sub">{item.sub}</p> : null}
      {unit ? (
        <p className="card-unit">
          {unit.was ? <span className="was">{eur(unit.was)}</span> : null}
          {eur(unit.now)} par séance
        </p>
      ) : null}

      <Accordion label="Détails">{item.details || DETAILS}</Accordion>
      <Accordion label="Validité">{item.validite || VALIDITE_ABO}</Accordion>

      <div className="card-foot">
        <p className="card-price">
          <span className="now">{eur(item.price)}</span>
          {item.old ? <span className="old">{eur(item.old)}</span> : null}
        </p>
        <button className={"btn-cart" + (added ? " added" : "")} onClick={add}>
          {added ? "Ajouté" : "Ajouter au panier"}
        </button>
      </div>
    </article>
  );
}

function AboCard({ abo, engagement, onAdd }) {
  const eng = ENGAGEMENTS.find((e) => e.id === engagement);
  const price = abo[eng.key];
  return (
    <Card
      item={{ ...abo, price, old: abo.base, details: DETAILS, validite: VALIDITE_ABO, sub: "" }}
      unit={{ was: Math.floor(abo.base / abo.n), now: Math.floor(price / abo.n) }}
      badges={[{ text: `Engagement ${eng.label}` }, { text: eng.save, save: true }]}
      onAdd={onAdd}
    />
  );
}
