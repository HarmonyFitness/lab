<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tarifs studio de sport à Bordeaux centre</title>
<meta name="description" content="Découvrez les tarifs de notre studio The Sport Society à Bordeaux centre : cours à l'unité, packs, abonnements et formules adaptées à vos besoins." />
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,700;1,400&family=DM+Serif+Text:ital@0;1&display=swap" />

<style>
/* =========================================================
   Jetons relevés sur la maquette Figma
   KV9B5sh1jj2364IfZOSFyz — node 1:508
   ========================================================= */
:root {
  --primary:    #204D6E;  /* nav, bouton Réserver, badge engagement, footer, bandeau app */
                          /* la maquette Figma donne #801624 : écart assumé */
  --terracotta: #aa6440;  /* bandeau d'annonces */
  --ink:        #1c0f0a;  /* texte principal, contour des cartes, badge remise */
  --ink-btn:    #09090b;  /* bouton « Ajouter au panier » */
  --ink-60:     rgba(28, 15, 10, .6);  /* étiquettes verticales */
  --grey-line:  #d1d5dc;  /* contour des onglets */
  --grey-text:  #9f9fa9;  /* prix barré */
  --grey-text2: #3f3f46;  /* prix par séance */
  --cream:      #fffcf6;  /* texte sur bordeaux */
  --cream-2:    #fefadd;  /* bandeau app */
  --sand:       #ba957a;  /* fond du hero */

  --font-sans:  "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-serif: "DM Serif Text", "Times New Roman", Times, serif;

  --header-h:  108px;   /* hauteur de l'en-tête, bandeau exclu */
  --marquee-h: 32px;
  --shell:     1280px;  /* conteneur de contenu (1920 − 2 × 320) */
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: #fff;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img { display: block; max-width: 100%; }

.shell { max-width: calc(var(--shell) + 64px); margin: 0 auto; padding: 0 32px; }
@media (max-width: 700px) { .shell { padding: 0 18px; } }

/* Emplacement d'un asset non encore exporté depuis Figma.
   Les dimensions sont fixées par l'appelant pour préserver la géométrie. */
.asset { background: rgba(32, 77, 110, .1); border-radius: inherit; }
.asset-photo {
  background:
    radial-gradient(60% 120% at 18% 40%, #c9a184 0%, rgba(201,161,132,0) 62%),
    linear-gradient(145deg, #b0846a 0%, #8a5b46 55%, #5f3b2c 100%);
}

/* =========================================================
   EN-TÊTE — node 1:459
   ========================================================= */
.header {
  position: fixed; inset: 0 0 auto 0; z-index: 60;
  height: var(--header-h);
  background: #fff;
  display: flex; align-items: center;
}
.header-inner {
  width: 100%; max-width: 1712px;      /* 1920 − 2 × 104 */
  margin: 0 auto; padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 32px;
}

/* Logo Harmony + étiquette de verticale (repris de fitness/offres/) */
.logo { display: inline-flex; align-items: center; gap: 12px; flex: none; }
.logo img { width: auto; height: 30px; }
.logo-fallback {
  display: inline-flex; align-items: center; height: 30px;
  color: var(--primary); font-size: 21px; font-weight: 700; letter-spacing: -.015em;
}
.logo-vertical {
  display: inline-block; padding-left: 12px;
  border-left: 1px solid #e6e9ec;
  font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  color: var(--primary); white-space: nowrap;
}

/* Navigation — node 1:482, écart 31.8px entre entrées */
.nav { display: flex; align-items: center; gap: 31.8px; }
.nav-link {
  position: relative;
  color: var(--primary);
  font-size: 16px; font-weight: 700; line-height: 24px;
  text-transform: uppercase; white-space: nowrap;
  display: inline-flex; align-items: center;
  transition: opacity .15s;
}
.nav-link:hover { opacity: .7; }
.nav-link.active::after {           /* node 1:487 */
  content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
  height: 1px; background: var(--primary);
}
.nav-link.serif {
  font-family: var(--font-serif); font-style: italic; font-weight: 400;
  font-size: 22px; line-height: 33px; text-transform: none;
}

/* Déroulant « Offres » */
.nav-dropdown { position: relative; padding-bottom: 16px; margin-bottom: -16px; }
.nav-dropdown > .nav-link { gap: 5px; }
.dd-arrow { display: inline-flex; align-items: center; transition: transform .2s; }
.nav-dropdown:hover .dd-arrow { transform: rotate(180deg); }
.dropdown-menu {
  position: absolute; top: calc(100% - 4px); left: 50%;
  transform: translateX(-50%) translateY(-6px);
  min-width: 292px; padding: 8px;
  background: #fff; border: 1px solid #e6e9ec; border-radius: 14px;
  box-shadow: 0 1px 2px rgba(28, 15, 10, .05), 0 16px 40px rgba(28, 15, 10, .14);
  opacity: 0; visibility: hidden;
  transition: opacity .15s, transform .2s, visibility .15s;
  z-index: 70;
}
.nav-dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
.dropdown-menu a {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 10px 14px; border-radius: 10px;
  text-transform: none; letter-spacing: 0; white-space: nowrap;
  transition: background .15s;
}
.dropdown-menu a:hover { background: #f1f3f5; }
.dd-title {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 700; line-height: 20px; color: var(--ink);
}
.dd-meta { font-size: 12.5px; font-weight: 400; line-height: 17px; color: var(--grey-text2); white-space: normal; }
.dd-tag {
  font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 999px; background: var(--primary); color: #fff; line-height: 1;
}

.nav-icons { display: flex; align-items: center; gap: 22px; margin-left: 10.2px; }
.icon-link {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; color: var(--primary);
  transition: opacity .15s;
}
.icon-link:hover { opacity: .7; }
.icon-link img, .icon-link svg { width: 20px; height: 20px; }
/* Bouton Réserver — node 1:501 : 116.78 × 36, rayon 2px */
.btn-book {
  display: inline-flex; align-items: center; justify-content: center;
  width: 116.78px; height: 36px; margin-left: 42.28px;
  border-radius: 2px; background: var(--primary);
  color: var(--cream);
  font-size: 14px; font-weight: 700; line-height: 20px;
  text-transform: uppercase; white-space: nowrap;
  transition: opacity .18s;
}
.btn-book:hover { opacity: .88; }

.burger { display: none; width: 36px; height: 36px; color: var(--primary); align-items: center; justify-content: center; }
@media (max-width: 1180px) {
  .nav { display: none; }
  .burger { display: inline-flex; }
}
@media (max-width: 560px) {
  .btn-book { width: auto; padding: 0 14px; margin-left: 0; font-size: 12.5px; }
  .nav-icons { gap: 8px; margin-left: 0; }
  .header-inner { gap: 12px; padding: 0 18px; }
  .logo { gap: 8px; }
  .logo img { height: 24px; }
  .logo-vertical { padding-left: 8px; font-size: 9.5px; letter-spacing: .14em; }
}

/* Menu mobile — node 1:437 */
.mobile-nav {
  position: fixed; left: 0; right: 0; top: calc(var(--header-h) + var(--marquee-h)); z-index: 55;
  background: #fff; border-bottom: 1px solid #eee;
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows .28s cubic-bezier(.22, 1, .36, 1);
}
.mobile-nav.open { grid-template-rows: 1fr; }
.mobile-nav > div { overflow: hidden; }
.mobile-nav nav { display: flex; flex-direction: column; align-items: center; padding: 18px 0 24px; gap: 4px; }
.mobile-nav a {
  padding: 12px 24px; color: var(--primary);
  font-size: 20px; font-weight: 700; line-height: 27px; text-transform: capitalize;
}
.mobile-nav a.mobile-sub { font-size: 15px; font-weight: 500; text-transform: none; padding: 8px 24px; opacity: .8; }
.mobile-nav .mobile-cta {
  display: inline-flex; align-items: center; justify-content: center;
  width: 199.28px; height: 40px; margin-bottom: 16px;
  border-radius: 2px; background: var(--primary); color: var(--cream);
  font-size: 16px; font-weight: 700; line-height: 20px; text-transform: none;
}

/* =========================================================
   BANDEAU D'ANNONCES — node 1:503 : fond #aa6440, 32px
   ========================================================= */
.marquee {
  position: fixed; left: 0; right: 0; top: var(--header-h); z-index: 50;
  height: var(--marquee-h);
  background: var(--terracotta); color: #fff;
  overflow: hidden; display: flex; align-items: center;
}
.marquee-track { display: flex; width: max-content; animation: marquee 60s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee-run { display: flex; align-items: center; flex: none; }
.marquee-item {
  margin-right: 255.8px; white-space: nowrap;      /* écart relevé sur la maquette */
  font-size: 14px; font-weight: 700; line-height: 20px;
}
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .marquee-track { animation: none; } }
@media (max-width: 700px) { .marquee-item { margin-right: 90px; font-size: 12px; } }

/* =========================================================
   HERO — node 1:4 : 396px, fond #ba957a
   ========================================================= */
.hero {
  position: relative;
  margin-top: calc(var(--header-h) + var(--marquee-h));   /* collé au bandeau ; la maquette laissait 28px */
  height: 396px;
  background: var(--sand);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.hero-media { position: absolute; inset: 0; }
/* Calque zoomé au scroll ; le voile reste sur .hero-media, hors transformation */
.hero-zoom {
  position: absolute; inset: 0;
  transform-origin: center 50%;
  will-change: transform;
}
.hero-media img { width: 100%; height: 100%; object-fit: cover; object-position: center 50%; }
.hero-media .asset { position: absolute; inset: 0; }
.hero-media::after {          /* voile : garde le titre lisible sur une photo claire */
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(28, 15, 10, .34) 0%, rgba(28, 15, 10, .20) 45%, rgba(28, 15, 10, .38) 100%);
}
.hero-media .asset-photo {                 /* teintes de l'aperçu encodé dans le site source */
  background: linear-gradient(100deg, #7a605c 0%, #8c7873 22%, #6b6f78 46%, #6d94a7 72%, #7299ac 100%);
}
.hero-title {
  position: relative; z-index: 2;
  margin: 0; text-align: center; color: #fff;
  letter-spacing: -1.2px;
  font-weight: 400; font-size: 47.4px; line-height: 48px;
}
.hero-title em {                       /* node 1:9 */
  font-family: var(--font-serif); font-style: italic; font-weight: 400;
  font-size: 52px; line-height: 52px;
  position: relative; top: -2px;
}
@media (max-width: 860px) {
  .hero { height: 300px; }
  .hero-title { font-size: 34px; line-height: 38px; }
  .hero-title em { font-size: 38px; }
}

/* =========================================================
   SECTIONS
   ========================================================= */
main { padding-bottom: 120px; }
.section { padding-top: 120px; }          /* hero → 1re section */
.section + .section { padding-top: 96px; }  /* entre sections */

.section-head { display: flex; align-items: center; gap: 7.8px; flex-wrap: wrap; height: 36px; }
.section-title {
  margin: 0;
  font-size: 29.3px; font-weight: 700; line-height: 36px;
  letter-spacing: -.75px; color: var(--ink);
}
.section-note {                        /* node 1:13 */
  font-style: italic; font-size: 22.5px; line-height: 32px; color: var(--ink);
}
.section-rule { width: 80px; height: 1px; background: var(--ink); margin-top: 12px; }
.section-lead { margin: 32px 0 0; height: 24px; font-size: 16px; line-height: 24px; color: var(--ink); }
@media (max-width: 700px) {
  .section { padding-top: 72px; }
  .section + .section { padding-top: 64px; }
  .section-head { height: auto; }
  .section-title { font-size: 24px; line-height: 30px; }
  .section-note { font-size: 18px; line-height: 24px; }
}

/* Rangée « Offres saisonnières » : rail + cartes — nodes 1:15 à 1:113 */
.season-row { display: flex; gap: 43.75px; margin: 32px 0 0 11.75px; align-items: stretch; }
.group { display: flex; align-items: stretch; }
.group-rail { position: relative; width: 44.25px; flex: none; }
.group-rail::before {                  /* Vertical Divider, node 1:15 */
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 1px; background: var(--ink); opacity: .18;
}
.group-tag {                           /* node 1:17, texte pivoté 90° */
  position: absolute; right: 0; bottom: 12px;
  writing-mode: vertical-rl;
  font-size: 12px; font-weight: 700; line-height: 16px;
  letter-spacing: 3.6px; text-transform: uppercase;
  color: var(--ink-60); white-space: nowrap;
}
.group-cards { flex: 1 1 auto; min-width: 0; }

.cards { display: grid; gap: 32px; align-items: start; }
.cards.c1 { grid-template-columns: minmax(0, 1fr); }                 /* carte du rail : 268px */
.cards.w280 { grid-template-columns: repeat(auto-fill, 280px); }     /* colonnes fixes, à gauche */
.cards.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }      /* trio du rail : 268px */
.season-row .group:first-child { width: 312.25px; flex: none; }
.season-row .group:last-child { flex: 1 1 auto; min-width: 0; }

@media (max-width: 1180px) {
  .season-row { display: block; margin-left: 0; }
  .season-row .group:first-child { width: auto; margin-bottom: 32px; }
  .group-rail { width: 34px; }
}
@media (max-width: 820px) { .cards.c3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) {
  .group { display: block; }
  .group-rail { width: auto; height: 26px; }
  .group-rail::before { display: none; }
  .group-tag { position: static; writing-mode: horizontal-tb; letter-spacing: 2px; }
  .cards.c3 { grid-template-columns: 1fr; }
  .cards.w280 { grid-template-columns: 1fr; }
}

/* =========================================================
   CARTE PRODUIT — nodes 1:43, 1:119, 1:165, 1:243
   contour 1px #1c0f0a, rayon 16px, marge intérieure 10px
   ========================================================= */
/* Apparition des cartes à l'entrée dans le viewport */
.reveal { opacity: 0; transform: translateY(14px) scale(.985); }
.reveal.in { opacity: 1; transform: none; transition: opacity .55s ease, transform .55s cubic-bezier(.22, 1, .36, 1); }
@media (prefers-reduced-motion: reduce) {
  .reveal, .reveal.in { opacity: 1; transform: none; transition: none; }
}

.card {
  position: relative;
  display: flex; flex-direction: column;
  border: 1px solid var(--ink); border-radius: 16px;
  padding: 10px 10px 23px;
  background: #fff;
  transition: box-shadow .22s;
}
.card:hover { box-shadow: 0 12px 30px rgba(28, 15, 10, .1); }

.card-media { position: relative; aspect-ratio: 258 / 135.44; border-radius: 10px; overflow: hidden; }
.card-media img { width: 100%; height: 100%; object-fit: cover; object-position: center 38%; }
.card-media .asset { position: absolute; inset: 0; }

/* Badges — node 1:63 (bordeaux) et 1:65 (encre), rayon 6px, hauteur 28px */
.badges { position: absolute; left: 9px; right: 9px; top: 8px; display: flex; justify-content: space-between; gap: 8px; }
.badge {
  display: inline-flex; align-items: center;
  height: 28px; padding: 0 12px; border-radius: 6px;
  background: var(--primary); color: var(--cream);
  font-size: 13.3px; font-weight: 400; line-height: 20px; white-space: nowrap;
}
.badge.badge-save { background: var(--ink); font-size: 13.9px; }

.card-title {
  margin: 17px 0 0; min-height: 32px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: 24px; font-weight: 700; line-height: 32px;
  letter-spacing: -.6px; text-transform: uppercase; color: var(--ink);
}
.season-row .card-title { font-size: 23.4px; }
.season-row .card-sub { min-height: 41px; line-height: 20.5px; }   /* node 1:20 : 2 lignes, 41px */
.card-sub {
  margin: 3px 0 0; min-height: 24px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: 15px; line-height: 24px; color: var(--grey-text2);
}
.card-unit {
  margin: 3px 0 0; height: 17px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14.8px; line-height: 24px; color: var(--grey-text2);
}
.card-unit .was { color: var(--grey-text); text-decoration: line-through; }

/* Accordéons — node 1:46 : filet bas noir, hauteur 41px */
.accs { margin-top: 20px; padding: 0 18.45px; }
.acc { border-bottom: 1px solid #000; }
.acc-head {
  width: 100%; height: 40px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 13.5px; font-weight: 700; line-height: 20px; color: var(--ink);
  text-align: left;
}
.acc-sign { position: relative; width: 14px; height: 14px; flex: none; }
.acc-sign::before, .acc-sign::after {
  content: ""; position: absolute; background: var(--ink);
  transition: transform .24s cubic-bezier(.22, 1, .36, 1), opacity .18s;
}
.acc-sign::before { top: 6.5px; left: 0; width: 14px; height: 1.5px; }
.acc-sign::after { left: 6.5px; top: 0; width: 1.5px; height: 14px; }
.acc.open .acc-sign::after { transform: rotate(90deg); opacity: 0; }
.acc-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s cubic-bezier(.22, 1, .36, 1); }
.acc.open .acc-panel { grid-template-rows: 1fr; }
.acc-panel > div { overflow: hidden; }
.acc-body { margin: 0; padding: 0 0 12px; font-size: 13px; line-height: 20px; color: var(--grey-text2); }

.card-foot { margin-top: auto; }
.card-price {
  margin: 21px 0 0; height: 31px;
  display: flex; align-items: center; justify-content: center; gap: 7.8px;
}
.card-price .now { font-size: 24.4px; font-weight: 700; line-height: 42px; color: var(--ink); }
.card-price .old { font-size: 17.5px; line-height: 30px; color: var(--grey-text); text-decoration: line-through; }

/* Bouton — node 1:60 : 194.23 × 40, fond #09090b, rayon 8px */
.btn-cart {
  display: flex; align-items: center; justify-content: center;
  width: 194.23px; max-width: 100%; height: 40px; margin: 22px auto 0;
  border-radius: 8px; background: var(--ink-btn); color: #fff;
  font-size: 14px; font-weight: 700; line-height: 21px; text-transform: uppercase;
  transition: opacity .18s;
}
.btn-cart:hover { opacity: .86; }
.btn-cart.added { background: var(--primary); }

/* =========================================================
   ONGLETS D'ENGAGEMENT — node 1:161 : 170.5 × 46
   ========================================================= */
.tabs {
  position: relative; display: inline-flex; align-items: center;
  height: 46px; padding: 4px; margin-top: 8px; width: 170.5px;
  border: 1px solid var(--grey-line); border-radius: 6px;
}
.tabs .pill {
  position: absolute; top: 4px; bottom: 4px;
  background: #000; border-radius: 6px; z-index: 0; pointer-events: none;
  transition: transform .32s cubic-bezier(.22, 1, .36, 1), width .32s cubic-bezier(.22, 1, .36, 1);
}
.tabs button {
  position: relative; z-index: 1; flex: 1 1 0;
  height: 36px; padding: 0; border-radius: 6px;
  font-size: 13.8px; font-weight: 700; line-height: 20px; color: #000;
  transition: color .2s; white-space: nowrap;
}
.tabs button.on { color: #fff; }

/* Onglets de carnet — nodes 1:239 / 1:241 : pilules séparées */
.pill-tabs { display: flex; gap: 8px; margin-top: 32px; flex-wrap: wrap; }
.pill-tab {
  height: 36px; padding: 0 17px; border-radius: 999px;
  border: 1px solid var(--grey-line); background: transparent;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
  font-size: 13.8px; font-weight: 700; line-height: 20px; color: #000;
  opacity: .6; transition: opacity .18s, border-color .18s;
}
.pill-tab:hover { opacity: .85; }
.pill-tab.on { border-color: #000; opacity: 1; }


/* =========================================================
   BANDEAU APPLICATION — node 1:378 : 500px, fond var(--primary)
   ========================================================= */
.appband { position: relative; height: 500px; background: var(--primary); overflow: hidden; }
.appband-media { position: absolute; inset: 0; }
.appband-media img { width: 100%; height: 100%; object-fit: cover; }
.appband-media .asset-photo {
  position: absolute; inset: 0;
  background: linear-gradient(105deg, #0f2637 0%, #204D6E 44%, #4585ad 72%, #a9c6d8 100%);
}
.appband-inner {
  position: relative; z-index: 1; height: 100%;
  max-width: 1920px; margin: 0 auto;
  display: flex; align-items: flex-start;
}
.appband-copy { margin-left: 52.5%; padding-top: 102.38px; }   /* x = 1008 / 1920 */
.app-eyebrow {
  display: inline-flex; align-items: center; justify-content: center;
  height: 36px; padding: 0 24px;
  background: var(--cream-2); color: var(--primary);
  font-size: 18px; font-weight: 700; line-height: 28px;
  letter-spacing: -.45px; text-transform: uppercase;
}
.app-title {
  margin: 32px 0 0;
  font-family: var(--font-serif); font-style: italic; font-weight: 400;
  font-size: 56px; line-height: 56px; letter-spacing: -1.4px; color: var(--cream-2);
}
.app-sub {
  margin: 27.5px 0 0; max-width: 435px;

/* Rend l'asset s'il est présent, sinon un aplat aux mêmes dimensions. */
function Asset({ src, w, h, alt = "", className = "", fallback = null }) {
  const [failed, setFailed] = useState(false);
  if (failed || !src) {
    if (fallback) return fallback;
    return <div className="asset" style={{ width: w, height: h }} aria-hidden="true" />;
  }
  return (
    <img
      src={src} alt={alt} className={className}
      width={w} height={h} style={{ width: w, height: h }}
      onError={() => setFailed(true)}
    />
  );
}

/* Image de contenu : remplit son cadre. Sans src propre, retombe sur la photo
   de couverture commune, puis sur un aplat si le fichier manque. */
function Photo({ src, alt = "", className = "" }) {
  const [failed, setFailed] = useState(false);
  const url = src || COVER;
  if (failed || !url) return <div className="asset asset-photo" aria-hidden="true" />;
  return <img src={url} alt={alt} className={className} onError={() => setFailed(true)} />;

function Hero() {
  const zoom = useRef(null);

  /* La photo grossit de 8 % le temps que le hero quitte l'écran. */
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let raf = null;
    const apply = () => {
      raf = null;
      const el = zoom.current;
      if (!el) return;
      const h = el.parentElement.offsetHeight || 1;
      const p = Math.min(1, Math.max(0, window.scrollY / h));
      el.style.transform = "scale(" + (1 + p * 0.08).toFixed(4) + ")";
    };
    const onScroll = () => { if (raf === null) raf = requestAnimationFrame(apply); };
    window.addEventListener("scroll", onScroll, { passive: true });
    apply();
    return () => {
      window.removeEventListener("scroll", onScroll);
      if (raf !== null) cancelAnimationFrame(raf);
    };
  }, []);

  return (
    <section className="hero" aria-labelledby="hero-title">
      <div className="hero-media" aria-hidden="true">
        <div className="hero-zoom" ref={zoom}>
          <Photo src={A.hero} />
        </div>
      </div>
      <h1 className="hero-title" id="hero-title">Consultez <em>nos tarifs</em></h1>
    </section>
  );
}

/* Ajoute la classe « in » quand l'élément entre dans le viewport. */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!("IntersectionObserver" in window) ||
        window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      el.classList.add("in");
      return;
    }
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { el.classList.add("in"); io.disconnect(); }
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.06 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

            <div className="cards w280" style={{ marginTop: 32 }}>
              {ABOS.map((a) => <AboCard key={a.id} abo={a} engagement={engagement} onAdd={add} />)}
            </div>
          </section>

          {/* Carnets de cours — node 1:237 */}
          <section className="section">
            <SectionHead emoji="🎟️" title="Carnets de cours" />
            <div className="pill-tabs">
              {Object.keys(CARNETS).map((k) => (
                <button
                  key={k}
                  className={"pill-tab" + (k === carnet ? " on" : "")}
                  onClick={() => setCarnet(k)}
                  aria-pressed={k === carnet}
                >
                  {CARNETS[k].label}
                </button>
              ))}
            </div>
            <div className="cards w280" style={{ marginTop: 40 }}>
              {CARNETS[carnet].items.map((c) => (
                <Card key={c.id} item={{ ...c, validite: VALIDITE_CARNET }} unit={{ now: c.unit }} onAdd={add} />
              ))}
            </div>
          </section>

        </div>
      </main>

      <AppBand />
      <Footer />
      <ToTop />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
