<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tarifs — maquette (d'après The Sport Society)</title>
<meta name="description" content="Maquette de laboratoire : la structure de la page tarifs de The Sport Society, rendue avec la charte Harmony (Eliptik Harmony, palette bleue, composants du repo)." />
<meta name="robots" content="noindex, nofollow" />

<link rel="icon" type="image/png" href="../../fitness/favicon.png" />
<link rel="apple-touch-icon" href="../../fitness/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />

<style>
/* =========================================================
   Eliptik Harmony — display typeface
   ========================================================= */
@font-face {
  font-family: 'Eliptik Harmony';
  src: url('../../fitness/fonts/Eliptik-Harmony-Thin.ttf') format('truetype');
  font-weight: 100; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Eliptik Harmony';
  src: url('../../fitness/fonts/Eliptik-Harmony-Light.ttf') format('truetype');
  font-weight: 300; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Eliptik Harmony';
  src: url('../../fitness/fonts/Eliptik-Harmony-Regular.ttf') format('truetype');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Eliptik Harmony';
  src: url('../../fitness/fonts/Eliptik-Harmony-Bold.ttf') format('truetype');
  font-weight: 700; font-style: normal; font-display: swap;
}

:root {
  --brand:      #3a8fc2;
  --brand-600:  #2b7aaa;
  --brand-700:  #1e6390;
  --brand-ink:  #0a3d5c;
  --brand-deep: #0a2540;
  --brand-300:  #8cc1de;
  --brand-200:  #c9e0ee;
  --brand-100:  #e4eff6;
  --brand-50:   #f3f8fb;

  --ink:   #0a1820;
  --ink-2: #2a3a44;
  --ink-3: #556772;
  --ink-4: #8a99a3;
  --ink-5: #b9c4cb;

  --line:   #e6e9ec;
  --line-2: #f1f3f5;
  --canvas: #ffffff;
  --soft-blue: #eff6fb;
  --soft-warm: #f6f4f0;

  --font-sans:    "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: 'Eliptik Harmony', "Geist", system-ui, sans-serif;
  --font-mono:    "Geist Mono", ui-monospace, "SF Mono", monospace;

  --grad-brand:     linear-gradient(135deg, #4aa3d8 0%, #2b7aaa 60%, #1e6390 100%);
  --grad-premium:   linear-gradient(150deg, #1e6390 0%, #0a3d5c 55%, #0a2540 100%);
  --grad-cta:       linear-gradient(135deg, #4aa3d8 0%, #2b7aaa 100%);
  --grad-cta-hover: linear-gradient(135deg, #5cb3e6 0%, #3a8fc2 100%);
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; background: var(--canvas); }
body {
  font-family: var(--font-sans);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
  letter-spacing: -0.005em;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.mono { font-family: var(--font-mono); }

.shell { max-width: 1360px; margin: 0 auto; padding: 0 40px; }
@media (max-width: 900px) { .shell { padding: 0 20px; } }

/* =========================================================
   GROUP BAR + TOPBAR (repris du repo)
   ========================================================= */
.group-bar { background: #f7f8fa; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.group-bar-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 36px; }
.group-label { display: inline-flex; align-items: center; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); font-weight: 600; white-space: nowrap; cursor: pointer; transition: color .15s; }
.group-label:hover { color: var(--ink-2); }
.group-nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.group-nav a { position: relative; padding: 8px 12px; font-size: 12.5px; color: var(--ink-3); font-weight: 500; border-radius: 6px; transition: color .15s, background .15s; white-space: nowrap; cursor: pointer; }
.group-nav a:hover { color: var(--ink); background: rgba(10,37,64,.04); }
.group-nav a.active { color: var(--brand-ink); background: var(--brand-100); }
.group-nav a.active::before { content: ""; width: 5px; height: 5px; border-radius: 999px; background: var(--brand); display: inline-block; margin-right: 6px; vertical-align: middle; margin-top: -2px; }
@media (max-width: 700px) {
  .group-bar-inner { height: auto; padding: 8px 0; flex-direction: column; align-items: flex-start; gap: 6px; }
  .group-nav { gap: 2px; }
  .group-nav a { padding: 6px 10px; font-size: 12px; }
}

.topbar { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.9); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); border-bottom: 1px solid var(--line); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 76px; gap: 32px; }
.topbar-left { display: flex; align-items: center; gap: 48px; }
.logo-wrap { display: inline-flex; align-items: center; gap: 12px; }
.logo-img { height: 26px; width: auto; display: block; }
.logo-vertical { display: inline-block; padding-left: 12px; border-left: 1px solid var(--line); font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--brand-ink); white-space: nowrap; }
.nav { display: flex; gap: 28px; font-size: 14.5px; color: var(--ink-3); font-weight: 500; align-items: center; }
.nav a { transition: color .15s; cursor: pointer; position: relative; padding: 4px 0; display: inline-flex; align-items: center; gap: 4px; }
.nav a:hover { color: var(--ink); }
.nav a.active { color: var(--ink); }
.nav a.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 2px; background: var(--brand); border-radius: 2px; }
.topbar-cta { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
.login-link { font-size: 13.5px; color: var(--ink-4); font-weight: 500; padding: 4px 10px; transition: color .15s; white-space: nowrap; }
.login-link:hover { color: var(--ink-2); }
.btn-primary { display: inline-flex; align-items: center; padding: 11px 20px; font-size: 13.5px; font-weight: 600; background: var(--grad-cta); color: #fff; border-radius: 999px; box-shadow: 0 1px 2px rgba(10,37,64,.12), 0 4px 12px rgba(58,143,194,.25); transition: transform .15s, box-shadow .18s, background .18s; white-space: nowrap; }
.btn-primary:hover { background: var(--grad-cta-hover); box-shadow: 0 2px 4px rgba(10,37,64,.15), 0 8px 20px rgba(58,143,194,.35); transform: translateY(-1px); }

/* Panier */
.cart-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 999px; color: var(--ink-3); transition: background .15s, color .15s; }
.cart-btn:hover { background: var(--line-2); color: var(--ink); }
.cart-count { position: absolute; top: 1px; right: 0; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #fff; }
@media (max-width: 1080px) { .nav { display: none; } }
@media (max-width: 620px) { .login-link { display: none; } }

/* =========================================================
   MARQUEE — bandeau d'annonces défilant
   ========================================================= */
.marquee { background: var(--brand-deep); color: rgba(255,255,255,.92); overflow: hidden; border-bottom: 1px solid rgba(255,255,255,.08); }
.marquee-track { display: flex; width: max-content; animation: marquee 42s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee-run { display: flex; align-items: center; flex: none; }
.marquee-item { display: inline-flex; align-items: center; gap: 9px; padding: 11px 0; margin-right: 64px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.marquee-item .dot { width: 5px; height: 5px; border-radius: 999px; background: var(--brand-300); flex: none; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .marquee-track { animation: none; } }

/* =========================================================
   HERO
   ========================================================= */
.hero {
  position: relative;
  height: 380px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  background: var(--brand-deep);
}
.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(90% 130% at 8% 40%, #2f6b8e 0%, rgba(47,107,142,0) 62%),
    radial-gradient(70% 120% at 92% 60%, #4f97c4 0%, rgba(79,151,196,0) 60%),
    linear-gradient(105deg, #0a2540 0%, #1e6390 48%, #5f9fc4 100%);
}
.hero-bg::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,37,64,.34) 0%, rgba(10,37,64,.12) 45%, rgba(10,37,64,.4) 100%);
}
.hero-title {
  position: relative; z-index: 2;
  margin: 0; text-align: center; color: #fff;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: clamp(38px, 5.4vw, 64px);
  line-height: 1.02;
  letter-spacing: -0.02em;
  text-shadow: 0 2px 30px rgba(10,37,64,.35);
}
.hero-title em { font-style: italic; font-weight: 400; }
@media (max-width: 700px) { .hero { height: 280px; } }

/* =========================================================
   SECTIONS
   ========================================================= */
.page { padding: 0 0 40px; }
.section { padding: 64px 0 0; }
.section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.section-title {
  display: inline-flex; align-items: center; gap: 12px;
  font-family: var(--font-display);
  font-weight: 700; font-size: clamp(24px, 2.6vw, 32px);
  letter-spacing: -0.02em; line-height: 1.1; margin: 0;
}
.section-emoji { font-size: .85em; line-height: 1; }
.section-note { color: var(--ink-3); font-size: 15px; font-style: italic; }
.section-lead { color: var(--ink-3); font-size: 14.5px; margin: 14px 0 12px; }

/* Étiquette verticale à gauche d'un groupe de cartes */
.group { display: flex; align-items: stretch; gap: 18px; }
.group-tag {
  writing-mode: vertical-rl; transform: rotate(180deg);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase;
  color: var(--ink-4); white-space: nowrap; padding: 4px 0; flex: none;
}
.group-body { flex: 1 1 auto; min-width: 0; }
@media (max-width: 760px) {
  .group { gap: 12px; }
  .group-tag { writing-mode: horizontal-tb; transform: none; justify-content: flex-start; padding: 0 0 8px; }
  .group { display: block; }
}

.cards { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); align-items: stretch; }
.cards.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cards.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cards.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 520px; }
.season-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); gap: 26px; align-items: start; margin-top: 26px; }
@media (max-width: 1080px) { .season-row { grid-template-columns: 1fr; } }
@media (max-width: 1080px) { .cards.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) { .cards.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) {
  .cards { grid-template-columns: 1fr; }
  .cards.cols-2, .cards.cols-3, .cards.cols-4 { grid-template-columns: 1fr; max-width: none; }
}

/* =========================================================
   CARTE PRODUIT
   ========================================================= */
.card {
  display: flex; flex-direction: column;
  background: var(--canvas);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 12px 14px;
  transition: border-color .18s, box-shadow .22s, transform .18s;
}
.card:hover { border-color: var(--brand-200); box-shadow: 0 1px 2px rgba(10,37,64,.04), 0 12px 32px rgba(10,37,64,.09); transform: translateY(-2px); }
.card.is-featured { border-color: var(--brand-300); box-shadow: 0 1px 2px rgba(10,37,64,.05), 0 10px 28px rgba(58,143,194,.16); }

.card-media { position: relative; height: 116px; border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.card-media .ph { position: absolute; inset: 0; }
.card-badges { position: absolute; inset: 8px 8px auto 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.badge {
  font-size: 10px; font-weight: 600; letter-spacing: .04em;
  padding: 4px 9px; border-radius: 999px;
  background: rgba(255,255,255,.86); color: var(--ink-2);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  white-space: nowrap;
}
.badge.badge-save { background: var(--brand-deep); color: #fff; font-weight: 700; }

.card-title { font-size: 15.5px; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; text-align: center; line-height: 1.2; margin: 0 0 4px; }
.card-sub { font-size: 12.5px; color: var(--ink-3); text-align: center; line-height: 1.4; margin: 0 0 10px; min-height: 18px; }
.card-unit { font-size: 12.5px; color: var(--ink-3); text-align: center; margin: 0 0 14px; }
.card-unit .was { color: var(--ink-5); text-decoration: line-through; margin-right: 5px; }
.card-unit .now { color: var(--brand-700); font-weight: 600; }

/* Accordéons */
.acc { border-top: 1px solid var(--line-2); }
.acc:last-of-type { border-bottom: 1px solid var(--line-2); }
.acc-head {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 2px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); text-align: left;
}
.acc-head:hover { color: var(--ink); }
.acc-sign { position: relative; width: 11px; height: 11px; flex: none; color: var(--ink-4); }
.acc-sign::before, .acc-sign::after { content: ""; position: absolute; background: currentColor; border-radius: 1px; transition: transform .22s cubic-bezier(.22,1,.36,1), opacity .18s; }
.acc-sign::before { top: 5px; left: 0; width: 11px; height: 1.4px; }
.acc-sign::after { left: 5px; top: 0; width: 1.4px; height: 11px; }
.acc.open .acc-sign::after { transform: rotate(90deg); opacity: 0; }
.acc-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s cubic-bezier(.22,1,.36,1); }
.acc.open .acc-panel { grid-template-rows: 1fr; }
.acc-panel > div { overflow: hidden; }
.acc-body { font-size: 12.5px; line-height: 1.55; color: var(--ink-3); padding: 0 2px 12px; margin: 0; }

.card-foot { margin-top: auto; padding-top: 16px; }
.card-price { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-bottom: 12px; }
.card-price .cur { font-size: 13px; font-weight: 600; color: var(--ink-3); letter-spacing: .02em; }
.card-price .val { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.card-price .old { font-size: 13.5px; color: var(--ink-5); text-decoration: line-through; }
.btn-cart {
  width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 14px; border-radius: 999px;
  border: 1px solid var(--line);
  font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-2);
  transition: background .18s, color .18s, border-color .18s, box-shadow .18s;
}
.btn-cart:hover { background: var(--grad-cta); border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(58,143,194,.3); }
.btn-cart.added { background: var(--brand-50); border-color: var(--brand-200); color: var(--brand-700); }

/* =========================================================
   SEGMENTED (repris du repo)
   ========================================================= */
.seg { position: relative; display: inline-flex; align-items: center; gap: 2px; background: var(--line-2); border-radius: 999px; padding: 4px; }
.seg .pill { position: absolute; top: 4px; bottom: 4px; background: var(--canvas); border-radius: 999px; box-shadow: 0 1px 2px rgba(10,24,32,.08), 0 0 0 1px rgba(10,24,32,.04); transition: transform .35s cubic-bezier(.22,1,.36,1), width .35s cubic-bezier(.22,1,.36,1); pointer-events: none; z-index: 0; }
.seg button { position: relative; z-index: 1; padding: 9px 16px; font-size: 14px; font-weight: 500; color: var(--ink-4); border-radius: 999px; transition: color .18s; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.seg button:hover { color: var(--ink-2); }
.seg button.on { color: var(--ink); }
.seg .save-chip { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--brand); color: #fff; letter-spacing: .02em; }

/* =========================================================
   CARTES CADEAUX
   ========================================================= */
.gift-grid { display: grid; gap: 18px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 26px; }
@media (max-width: 860px) { .gift-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .gift-grid { grid-template-columns: 1fr; } }
.gift {
  position: relative; overflow: hidden;
  border-radius: 16px; padding: 24px 22px 22px;
  color: #fff;
  min-height: 176px;
  display: flex; flex-direction: column; justify-content: space-between;
  transition: transform .18s, box-shadow .22s;
}
.gift:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(10,37,64,.2); }
.gift::after { content: ""; position: absolute; right: -38px; top: -38px; width: 130px; height: 130px; border-radius: 999px; background: rgba(255,255,255,.09); }
.gift-eyebrow { position: relative; z-index: 1; font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.72); }
.gift-amount { position: relative; z-index: 1; font-family: var(--font-display); font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; margin: 14px 0 6px; }
.gift-desc { position: relative; z-index: 1; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.8); margin: 0 0 18px; }
.gift-cta { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.26); font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; transition: background .18s; }
.gift-cta:hover { background: rgba(255,255,255,.24); }

/* =========================================================
   BANDEAU APPLICATION
   ========================================================= */
.appband { position: relative; overflow: hidden; margin-top: 76px; background: var(--brand-deep); }
.appband-bg { position: absolute; inset: 0; background: radial-gradient(80% 140% at 18% 50%, #1e6390 0%, rgba(30,99,144,0) 60%), linear-gradient(115deg, #0a2540 0%, #123a5c 55%, #1e6390 100%); }
.appband-inner { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; padding: 64px 0; }
.appband-art { display: flex; justify-content: center; }
.phone { width: 200px; height: 292px; border-radius: 26px; background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.22); padding: 12px; box-shadow: 0 30px 60px rgba(0,0,0,.34); }
.phone-screen { height: 100%; border-radius: 16px; background: rgba(255,255,255,.94); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.phone-line { border-radius: 5px; background: var(--line); }
.phone-chip { border-radius: 999px; background: var(--brand-100); }
.appband-copy { color: #fff; }
.app-eyebrow { display: inline-flex; padding: 6px 13px; border-radius: 999px; background: #fff; color: var(--brand-ink); font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.app-title { font-family: var(--font-display); font-weight: 300; font-style: italic; font-size: clamp(32px, 4vw, 48px); letter-spacing: -0.02em; margin: 20px 0 14px; line-height: 1.05; }
.app-sub { font-size: 12.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; line-height: 1.7; color: rgba(255,255,255,.74); margin: 0 0 26px; max-width: 380px; }
.store-row { display: flex; gap: 12px; flex-wrap: wrap; }
.store-btn { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 10px; background: #0a1820; border: 1px solid rgba(255,255,255,.16); color: #fff; transition: transform .15s, border-color .18s; }
.store-btn:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.34); }
.store-btn .store-sm { display: block; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.66); }
.store-btn .store-lg { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
@media (max-width: 900px) {
  .appband-inner { grid-template-columns: 1fr; gap: 36px; padding: 48px 0; }
  .appband-art { order: 2; }
}

/* =========================================================
   FOOTER
   ========================================================= */
.footer { background: #f7f8fa; border-top: 1px solid var(--line); padding: 44px 0 34px; text-align: center; }
.footer-links { display: flex; align-items: center; justify-content: center; gap: 8px 4px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }

   Les montants 3 mois viennent du modèle ; ceux à 12 mois sont une projection à −20 %. */

const DECOUVERTE = [

/* =========================================================
   BRIQUES
   ========================================================= */
function Segmented({ items, value, onChange }) {
  const wrapRef = useRef(null);
  const [pill, setPill] = useState({ left: 0, width: 0 });

  useLayoutEffect(() => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    const active = wrap.querySelector("button.on");
    if (!active) return;
    setPill({ left: active.offsetLeft, width: active.offsetWidth });
  }, [value, items]);

  return (
    <div className="seg" ref={wrapRef}>
      <span className="pill" style={{ transform: `translateX(${pill.left}px)`, width: pill.width }} />
      {items.map((it) => (
        <button
          key={it.id}
          className={it.id === value ? "on" : ""}
          onClick={() => onChange(it.id)}
          aria-pressed={it.id === value}
        >
          {it.label}
          {it.save ? <span className="save-chip">{it.save}</span> : null}
        </button>
      ))}
    </div>
  );
}

function Accordion({ label, children }) {
  const [open, setOpen] = useState(false);
  return (
    <div className={"acc" + (open ? " open" : "")}>
      <button className="acc-head" onClick={() => setOpen((o) => !o)} aria-expanded={open}>
        {label}
        <span className="acc-sign" aria-hidden="true" />
      </button>
      <div className="acc-panel">
        <div><p className="acc-body">{children}</p></div>
      </div>
    </div>
  );
}

function Price({ value, old }) {
  return (
    <div className="card-price">
      <span className="cur">{CUR}</span>
      <span className="val num">{value}</span>
      {old ? <span className="old num">{CUR} {old}</span> : null}
    </div>
  );
}

function ProductCard({ item, unit, badges, featured, onAdd }) {
  const [added, setAdded] = useState(false);
  const add = () => {
    setAdded(true);
    onAdd();
    setTimeout(() => setAdded(false), 1600);
  };
  return (
    <article className={"card" + (featured ? " is-featured" : "")}>
      <div className="card-media">
        <div className="ph" style={{ background: PH[item.ph % PH.length] }} />
        {badges && badges.length ? (
          <div className="card-badges">
            {badges.map((b, i) => (
              <span key={i} className={"badge" + (b.save ? " badge-save" : "")}>{b.text}</span>
            ))}
          </div>
        ) : null}
      </div>

      <h3 className="card-title">{item.title}</h3>
      <p className="card-sub">{item.sub || ""}</p>
      {unit ? (
        <p className="card-unit">
          {unit.was ? <span className="was num">{CUR} {unit.was}</span> : null}
          <span className="now num">{CUR} {unit.now}</span> par séance
        </p>
      ) : null}

      <Accordion label="Détails">{item.details || DETAILS_DEFAUT}</Accordion>
      <Accordion label="Validité">{item.validite || VALIDITE_ABO}</Accordion>

      <div className="card-foot">
        <Price value={item.price} old={item.old} />
        <button className={"btn-cart" + (added ? " added" : "")} onClick={add}>
          {added ? "Ajouté" : "Ajouter au panier"}
        </button>
      </div>
    </article>
  );
}

function AboCard({ abo, engagement, onAdd }) {
  const eng = ENGAGEMENTS.find((e) => e.id === engagement);
  const price = abo[eng.key];
  const item = {
    id: abo.id,
    title: abo.title,
    sub: "",
    price,
    old: abo.base,
    ph: abo.ph,
    details: DETAILS_DEFAUT,
    validite: VALIDITE_ABO,
  };
  return (
    <ProductCard
      item={item}
      unit={{ was: Math.floor(abo.base / abo.n), now: Math.floor(price / abo.n) }}
      badges={[
        { text: `Engagement ${eng.label}` },
        { text: eng.save, save: true },
      ]}
      featured={abo.n === 8}
      onAdd={onAdd}
    />
  );
}

function SectionHead({ emoji, title, note }) {
  return (
    <div className="section-head">
      <h2 className="section-title">

  );
}

            </div>
          </section>

        </div>
      </main>

      <AppBand />
      <Footer />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
